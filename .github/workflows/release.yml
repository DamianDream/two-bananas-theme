name: Release VS Code Theme

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package.json version with tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Build theme JSON from TypeScript tokens
        run: npm run build:theme

      - name: WCAG contrast gate (fails build on unreadable colors)
        run: npm run test:contrast

      - name: Package .vsix
        run: npx vsce package --out two-bananas-theme.vsix

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath two-bananas-theme.vsix --pat "$VSCE_PAT" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        run: npx ovsx publish two-bananas-theme.vsix -p "$OVSX_PAT" --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: two-bananas-theme.vsix
          generate_release_notes: true
